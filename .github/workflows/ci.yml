name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install ruff==0.14.13 pytest pytest-asyncio

      - name: Ruff (error-level rules)
        run: ruff check reachy_mini_home_assistant/ --select E4,E7,E9,F

      - name: Tests
        run: pytest tests/ -q
